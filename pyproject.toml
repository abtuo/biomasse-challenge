[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomass-mapping"
version = "0.1.0"
description = "Reproducible forest biomass mapping pipeline for GEDI + multisensor remote sensing."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Aboubacar Tuo"}
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "geopandas>=0.14",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "pyarrow>=15",
  "joblib>=1.3",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
data = [
  "datasets>=3.0"
]
boosting = [
  "lightgbm>=4.3",
  "xgboost>=2.0"
]
dev = [
  "pytest>=8",
  "ruff>=0.4"
]

[project.scripts]
biomass = "biomass_mapping.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Typer intentionally declares CLI options through function-call defaults.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
